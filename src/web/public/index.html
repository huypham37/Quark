const {useState,useRef,useEffect,useCallback,useMemo,useReducer}=React;
const VH_FALLBACK=CSS.supports('height','100svh')?'100svh':CSS.supports('height','100dvh')?'100dvh':'100vh';

// Hook: track actual visible viewport height (handles mobile browser chrome)
function useViewportHeight(){
  const[vh,setVh]=useState(()=>{
    if(window.visualViewport)return window.visualViewport.height+'px';
    return VH_FALLBACK;
  });
  useEffect(()=>{
    const vv=window.visualViewport;
    if(!vv)return;
    const update=()=>{
      const h=vv.height+'px';
      setVh(h);
      document.documentElement.style.setProperty('--vh-actual',h);
    };
    update();
    vv.addEventListener('resize',update);
    vv.addEventListener('scroll',update);
    return()=>{vv.removeEventListener('resize',update);vv.removeEventListener('scroll',update)};
  },[]);
  return vh;
}

// ═══════════════════════════════════════════════════════════════════
// API + WebSocket helpers
// ═══════════════════════════════════════════════════════════════════
async function api(method,path,body){
  const opts={method,headers:{'Content-Type':'application/json'}};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(path,opts);
  return r.json();
}

// ═══════════════════════════════════════════════════════════════════
// Tool helpers
// ═══════════════════════════════════════════════════════════════════
const TOOL_LABELS={read:'Read',write:'Write',edit:'Edit',bash:'Bash',skill:'Skill',todo:'Todo',grep:'Search',glob:'Glob',websearch:'Web Search',webfetch:'Fetch',compact:'Compact'};
function toolLabel(id){return TOOL_LABELS[id]||id.charAt(0).toUpperCase()+id.slice(1)}
function toolDesc(tool,input){
  if(!input)return '';
  if((tool==='read'||tool==='write'||tool==='edit')&&(input.path||input.filePath))return input.path||input.filePath;
  if(tool==='bash'&&input.command)return input.command.slice(0,70);
  if(tool==='grep'&&input.pattern)return input.pattern;
  if(tool==='glob'&&input.pattern)return input.pattern;
  if(tool==='skill'&&input.name)return input.name;
  if(tool==='websearch'&&input.query)return input.query.slice(0,50);
  if(tool==='webfetch'&&input.url)return input.url.slice(0,50);
  return '';
}

// ═══════════════════════════════════════════════════════════════════
// Markdown-ish renderer
// ═══════════════════════════════════════════════════════════════════
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}

function RichText({text}){
  const parts=text.split(/(```[\s\S]*?```)/g);
  return React.createElement('div',{style:{fontSize:14,lineHeight:1.65,color:T.text,whiteSpace:'pre-wrap',wordBreak:'break-word',overflowWrap:'anywhere',maxWidth:'100%',overflow:'hidden'}},
    parts.map((part,i)=>{
      if(part.startsWith('```')&&part.endsWith('```')){
        const inner=part.slice(3,-3);
        const nl=inner.indexOf('\n');
        const lang=nl>0?inner.slice(0,nl).trim():'';
        const code=nl>0?inner.slice(nl+1):inner;
        return React.createElement(CodeBlock,{key:i,lang,code});
      }
      return React.createElement(InlineText,{key:i,text:part});
    })
  );
}

function InlineText({text}){
  const html=esc(text)
    .replace(/`([^`]+)`/g,'<code style="background:'+T.surface2+';padding:1px 5px;border-radius:4px;font-family:'+T.mono+';font-size:12.5px">$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong style="font-weight:500">$1</strong>')
    .replace(/\*([^*]+)\*/g,'<em>$1</em>');
  return React.createElement('span',{dangerouslySetInnerHTML:{__html:html}});
}

function CodeBlock({lang,code}){
  const [copied,setCopied]=useState(false);
  const doCopy=()=>{navigator.clipboard.writeText(code);setCopied(true);setTimeout(()=>setCopied(false),2000)};
  return React.createElement('div',{style:{margin:'10px 0',border:'1px solid '+T.border,borderRadius:T.radius,overflow:'hidden',maxWidth:'100%'}},
    React.createElement('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'5px 12px',background:T.surface,fontSize:11,color:T.text3}},
      React.createElement('span',null,lang||'code'),
      React.createElement('button',{onClick:doCopy,style:{background:'none',border:'none',color:T.text3,font:'inherit',fontSize:11,cursor:'pointer',padding:'2px 6px',borderRadius:4}},copied?'Copied!':'Copy')
    ),
    React.createElement('pre',{style:{padding:12,overflow:'auto',fontFamily:T.mono,fontSize:12,lineHeight:1.5,color:T.text2,background:T.bg,margin:0,whiteSpace:'pre',wordBreak:'normal'}},code)
  );
}

// ═══════════════════════════════════════════════════════════════════
// Reducer for app state
// ═══════════════════════════════════════════════════════════════════
const init={
  sessionId:null,
  sessions:[],
  messages:[],       // [{id,role,parts:[...]}]
  running:false,
  connected:false,
  tokensUsed:0,tokenLimit:0,
  modelName:'—',
  models:[],
  permission:null,
  toasts:[],
  sidebarOpen:false,
  modelPickerOpen:false,
};

function reducer(s,a){
  switch(a.type){
    case 'SET':return{...s,...a.payload};
    case 'ADD_TOAST':return{...s,toasts:[...s.toasts,{id:Date.now(),title:a.title,body:a.body,kind:a.kind||'error'}]};
    case 'REMOVE_TOAST':return{...s,toasts:s.toasts.filter(t=>t.id!==a.id)};
    case 'ADD_USER_MSG':{
      if(s.messages.find(m=>m.id===a.id))return s;
      return{...s,messages:[...s.messages,{id:a.id,role:'user',parts:[{type:'text',text:a.text}]}]};
    }
    case 'ENSURE_ASSISTANT':{
      if(s.messages.find(m=>m.id===a.id))return s;
      return{...s,messages:[...s.messages,{id:a.id,role:'assistant',parts:[]}]};
    }
    case 'UPDATE_MSG':{
      return{...s,messages:s.messages.map(m=>m.id===a.id?a.updater(m):m)};
    }
    case 'CLEAR_MESSAGES':return{...s,messages:[]};
    case 'LOAD_MESSAGES':return{...s,messages:a.messages};
    default:return s;
  }
}

// ═══════════════════════════════════════════════════════════════════
// Main App
// ═══════════════════════════════════════════════════════════════════
function App(){
  const VH=useViewportHeight();
  const[s,dispatch]=useReducer(reducer,init);
  const wsRef=useRef(null);
  const msgEndRef=useRef(null);
  const inputRef=useRef(null);
  const reconnectDelay=useRef(1000);

  const set=(p)=>dispatch({type:'SET',payload:p});
  const toast=(title,body,kind)=>{
    const id=Date.now();
    dispatch({type:'ADD_TOAST',title,body,kind});
    setTimeout(()=>dispatch({type:'REMOVE_TOAST',id}),5000);
  };

  // Auto-scroll
  useEffect(()=>{
    if(msgEndRef.current)msgEndRef.current.scrollIntoView({behavior:'smooth',block:'end'});
  },[s.messages,s.running]);

  // ── WebSocket ──
  useEffect(()=>{
    let ws;
    function connect(){
      const proto=location.protocol==='https:'?'wss':'ws';
      ws=new WebSocket(`${proto}://${location.host}/ws`);
      wsRef.current=ws;

      ws.onopen=()=>{set({connected:true});reconnectDelay.current=1000};
      ws.onclose=()=>{set({connected:false});setTimeout(connect,reconnectDelay.current);reconnectDelay.current=Math.min(reconnectDelay.current*2,30000)};
      ws.onerror=()=>{};
      ws.onmessage=(e)=>{
        try{
          const{event,data}=JSON.parse(e.data);
          handleEvent(event,data);
        }catch{}
      };

      const ping=setInterval(()=>{if(ws.readyState===1)ws.send(JSON.stringify({type:'ping'}))},30000);
      ws.addEventListener('close',()=>clearInterval(ping));
    }
    connect();
    return()=>{if(ws)ws.close()};
  },[]);

  // ── Event handler (using dispatch) ──
  function handleEvent(event,d){
    switch(event){
      case 'session-created':
        set({sessionId:d.sessionId});
        refreshSessions();
        break;
      case 'user-message':
        dispatch({type:'ADD_USER_MSG',id:d.messageId,text:d.text});
        break;
      case 'assistant-message-start':
        dispatch({type:'ENSURE_ASSISTANT',id:d.messageId});
        break;
      case 'text-start':
        dispatch({type:'ENSURE_ASSISTANT',id:d.messageId});
        dispatch({type:'UPDATE_MSG',id:d.messageId,updater:m=>{
          const hasTxt=m.parts.find(p=>p.type==='text'&&p.partId===d.partId);
          if(hasTxt)return m;
          return{...m,parts:[...m.parts,{type:'text',text:'',partId:d.partId,streaming:true}]};
        }});
        break;
      case 'text-delta':
        dispatch({type:'UPDATE_MSG',id:d.messageId,updater:m=>({...m,parts:m.parts.map(p=>p.type==='text'&&p.partId===d.partId?{...p,text:d.text,streaming:true}:p)})});
        break;
      case 'text-end':
        dispatch({type:'UPDATE_MSG',id:d.messageId,updater:m=>({...m,parts:m.parts.map(p=>p.type==='text'&&p.partId===d.partId?{...p,text:d.text,streaming:false}:p)})});
        break;
      case 'tool-start':
        dispatch({type:'ENSURE_ASSISTANT',id:d.messageId});
        dispatch({type:'UPDATE_MSG',id:d.messageId,updater:m=>({...m,parts:[...m.parts,{type:'tool',tool:d.tool,callId:d.callId,status:'running',input:null,output:null,error:null}]})});
        break;
      case 'tool-input':
        dispatch({type:'UPDATE_MSG',id:d.messageId,updater:m=>({...m,parts:m.parts.map(p=>p.type==='tool'&&p.callId===d.callId?{...p,input:d.input}:p)})});
        break;
      case 'tool-end':
        dispatch({type:'UPDATE_MSG',id:d.messageId,updater:m=>({...m,parts:m.parts.map(p=>p.type==='tool'&&p.callId===d.callId?{...p,status:d.status==='completed'?'completed':'error',output:d.output||null,error:d.error||null}:p)})});
        break;
      case 'reasoning-start':
        dispatch({type:'ENSURE_ASSISTANT',id:d.messageId});
        dispatch({type:'UPDATE_MSG',id:d.messageId,updater:m=>({...m,parts:[...m.parts,{type:'thinking',text:'',partId:d.partId,done:false}]})});
        break;
      case 'reasoning-delta':
        dispatch({type:'UPDATE_MSG',id:d.messageId,updater:m=>({...m,parts:m.parts.map(p=>p.type==='thinking'&&p.partId===d.partId?{...p,text:d.text}:p)})});
        break;
      case 'reasoning-end':
        dispatch({type:'UPDATE_MSG',id:d.messageId,updater:m=>({...m,parts:m.parts.map(p=>p.type==='thinking'&&p.partId===d.partId?{...p,done:true}:p)})});
        break;
      case 'step-finish':
        if(d.data?.tokens?.input)set({tokensUsed:d.data.tokens.input});
        break;
      case 'loop-start':set({running:true});break;
      case 'loop-end':set({running:false});break;
      case 'assistant-message-end':
        if(d.finish==='stop'||d.finish==='length')set({running:false});
        break;
      case 'permission-request':
        set({permission:d});
        break;
      case 'error':{
        const t=typeof d.error==='string'?d.error:(d.error?.message||JSON.stringify(d.error));
        if(!/abort/i.test(t))toast('Error',t,'error');
        break;
      }
      case 'retry':
        toast('Retrying',`Attempt ${d.attempt} — ${Math.round((d.delayMs||1000)/1000)}s…`,'warn');
        break;
      case 'compaction-start':
        toast('Compacting','Compacting context…','warn');
        break;
      case 'session-switch':
        set({sessionId:d.sessionId});
        if(d.messages)dispatch({type:'LOAD_MESSAGES',messages:d.messages});
        if(d.estimatedTokens)set({tokensUsed:d.estimatedTokens});
        break;
      case 'session-reset':
        set({sessionId:d.sessionId});
        dispatch({type:'CLEAR_MESSAGES'});
        set({tokensUsed:0});
        break;
      // sub-agent events — minimal handling
      case 'subagent-tool-start':
      case 'subagent-tool-input':
      case 'subagent-tool-end':
      case 'subagent-step-finish':
      case 'subagent-text-delta':
      case 'subagent-done':
        break;
    }
  }

  // ── REST calls ──
  async function refreshSessions(){
    try{const ss=await api('GET','/api/sessions');set({sessions:ss})}catch{}
  }
  async function loadModels(){
    try{
      const[mr,cr]=await Promise.all([api('GET','/api/models'),api('GET','/api/model')]);
      set({models:mr.models||[],modelName:cr.model||'—'});
    }catch{}
  }
  async function loadConfig(){
    try{const c=await api('GET','/api/config');set({tokenLimit:c.contextWindow||200000})}catch{}
  }

  useEffect(()=>{refreshSessions();loadModels();loadConfig()},[]);

  // ── Actions ──
  async function sendMessage(text){
    if(!text.trim()||s.running)return;
    const body={text:text.trim()};
    if(s.sessionId)body.sessionId=s.sessionId;
    try{
      const r=await api('POST','/api/prompt',body);
      if(r.sessionId)set({sessionId:r.sessionId});
    }catch{toast('Error','Failed to send','error')}
  }
  async function cancelAgent(){
    if(!s.sessionId)return;
    try{await api('POST','/api/cancel',{sessionId:s.sessionId})}catch{}
  }
  async function switchSession(id){
    set({sessionId:id,tokensUsed:0,sidebarOpen:false});
    try{
      const msgs=await api('GET',`/api/sessions/${id}/messages`);
      dispatch({type:'LOAD_MESSAGES',messages:msgs});
    }catch{toast('Error','Failed to load session','error')}
  }
  async function newSession(){
    try{
      const r=await api('POST','/api/sessions');
      set({sessionId:r.sessionId});
      dispatch({type:'CLEAR_MESSAGES'});
      set({tokensUsed:0});
      await refreshSessions();
    }catch{}
  }
  async function switchModel(model){
    try{
      const r=await api('POST','/api/model',{model});
      set({modelName:r.model||model,modelPickerOpen:false});
    }catch{toast('Error','Failed to switch model','error')}
  }
  async function respondPerm(action){
    if(!s.permission)return;
    set({permission:null});
    try{await api('POST','/api/permission',{sessionId:s.sessionId,requestId:s.permission.requestId,action})}catch{}
  }

  function fmtTokens(n){
    if(!n)return '0';
    if(n>=1e6)return(n/1e6).toFixed(1)+'M';
    if(n>=1e3)return(n/1e3).toFixed(1)+'k';
    return String(n);
  }

  const getGreeting=()=>{const h=new Date().getHours();return h<12?'this morning':h<17?'this afternoon':'this evening'};

  const hasMessages=s.messages.length>0;

  // ═════════════ Render ═════════════
  return React.createElement('div',{style:{display:'flex',width:'100%',height:VH,background:T.bgDeep,fontFamily:T.font,overflow:'hidden'}},

    // ── Sidebar overlay ──
    s.sidebarOpen&&React.createElement('div',{onClick:()=>set({sidebarOpen:false}),style:{position:'fixed',inset:0,background:'rgba(0,0,0,0.5)',zIndex:50}}),

    // ── Sidebar ──
    React.createElement('aside',{style:{position:'fixed',left:s.sidebarOpen?0:-280,top:0,bottom:0,width:280,background:T.bg,borderRight:`1px solid ${T.border}`,zIndex:51,transition:'left 0.2s ease',display:'flex',flexDirection:'column',padding:'calc(16px + env(safe-area-inset-top, 0px)) 12px calc(16px + env(safe-area-inset-bottom, 0px))'}},
      React.createElement('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16,padding:'0 4px'}},
        React.createElement('span',{style:{fontFamily:T.fontBrand,fontWeight:500,fontSize:15,letterSpacing:'0.18em',color:T.text}},'QUARK'),

// ═══════════════════════════════════════════════════════════════════
// MessageItem
// ═══════════════════════════════════════════════════════════════════
function MessageItem({msg}){
  if(msg.role==='user'){
    const text=msg.parts.find(p=>p.type==='text');
    return React.createElement('div',{style:{display:'flex',justifyContent:'flex-end',padding:'12px 0',animation:'fadeUp 0.2s ease-out'}},
      React.createElement('div',{style:{background:T.surface2,borderRadius:'18px 18px 4px 18px',padding:'10px 14px',maxWidth:'70%',fontSize:14,lineHeight:1.55,whiteSpace:'pre-wrap',wordBreak:'break-word',color:T.text,overflow:'hidden'}},
        text?text.text:''
      )
    );
  }

  // Assistant
  return React.createElement('div',{style:{padding:'14px 0',animation:'fadeUp 0.25s ease-out'}},
    React.createElement('div',{style:{display:'flex',alignItems:'center',gap:6,marginBottom:8}},
      React.createElement(AgentDot),
      React.createElement('span',{style:{fontSize:11,fontWeight:500,textTransform:'uppercase',letterSpacing:'0.06em',color:T.text3}},'Quark')
    ),
    msg.parts.map((part,i)=>{
      if(part.type==='text')return React.createElement('div',{key:i},
        React.createElement(RichText,{text:part.text}),
        part.streaming&&React.createElement('span',{style:{display:'inline-block',width:6,height:14,background:T.text,borderRadius:1,marginLeft:2,verticalAlign:'text-bottom',animation:'blink 1s step-end infinite'}})
      );
      if(part.type==='tool')return React.createElement(ToolCallPart,{key:part.callId||i,part});
      if(part.type==='thinking')return React.createElement(ThinkingPart,{key:i,part});
      return null;
    })
  );
}

// ═══════════════════════════════════════════════════════════════════
// ToolCallPart
// ═══════════════════════════════════════════════════════════════════
function ToolCallPart({part}){
  const[open,setOpen]=useState(false);
  const isRunning=part.status==='running';
  const isDone=part.status==='completed';
  const isErr=part.status==='error';

  return React.createElement('div',{style:{margin:'8px 0',border:`1px solid ${T.border}`,borderRadius:T.radius,overflow:'hidden',background:T.surface}},
    // Header
    React.createElement('div',{onClick:()=>setOpen(!open),style:{display:'flex',alignItems:'center',gap:6,padding:'8px 10px',cursor:'pointer',transition:'background 0.1s',overflow:'hidden'}},
      React.createElement('span',{style:{flexShrink:0,display:'flex',alignItems:'center'}},
        isRunning?React.createElement(Spinner,{size:13}):isDone?React.createElement(CheckIcon):React.createElement(ErrIcon)
      ),
      React.createElement('span',{style:{fontSize:13,fontWeight:500,color:T.text,flexShrink:0}},toolLabel(part.tool)),
      React.createElement('span',{style:{fontSize:11,color:T.text3,flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontFamily:T.mono,textAlign:'right'}},toolDesc(part.tool,part.input)),
      React.createElement('span',{style:{fontSize:10,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.05em',flexShrink:0,color:isRunning?T.yellow:isDone?T.green:T.red}},isRunning?'running':isDone?'done':'error')
    ),
    // Body
    open&&React.createElement('div',{style:{padding:'0 10px 10px',fontSize:12,overflow:'hidden'}},
      React.createElement('div',{style:{fontSize:10,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.06em',color:T.text3,margin:'4px 0'}},'Input'),
      React.createElement('pre',{style:{background:T.surface2,borderRadius:8,padding:'8px 10px',fontFamily:T.mono,fontSize:11,lineHeight:1.45,color:T.text2,overflow:'auto',maxHeight:260,whiteSpace:'pre-wrap',wordBreak:'break-all',margin:0}},part.input?JSON.stringify(part.input,null,2):'…'),
      (part.output||part.error)&&React.createElement(React.Fragment,null,
        React.createElement('div',{style:{fontSize:10,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.06em',color:T.text3,margin:'10px 0 4px'}},part.error?'Error':'Output'),
        React.createElement('pre',{style:{background:T.surface2,borderRadius:8,padding:'8px 10px',fontFamily:T.mono,fontSize:11,lineHeight:1.45,color:part.error?T.red:T.text2,overflow:'auto',maxHeight:300,whiteSpace:'pre-wrap',wordBreak:'break-all',margin:0}},(part.error||part.output||'').slice(0,5000))
      )
    )
  );
}

// ═══════════════════════════════════════════════════════════════════

// TypingIndicator
// ═══════════════════════════════════════════════════════════════════
function TypingIndicator(){

    React.createElement(AgentDot),

// ═══════════════════════════════════════════════════════════════════
// InputArea
// ═══════════════════════════════════════════════════════════════════
function InputArea({onSend,running,onCancel}){
  const[text,setText]=useState('');
  const ref=useRef(null);

  useEffect(()=>{
    if(ref.current){ref.current.style.height='auto';ref.current.style.height=Math.min(ref.current.scrollHeight,200)+'px'}
  },[text]);

  const handleKey=(e)=>{
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSend()}
    if(e.key==='Escape'&&running)onCancel();
  };
  const doSend=()=>{if(!text.trim()||running)return;onSend(text);setText('')};

  const hasText=text.trim().length>0;

  return React.createElement('div',{style:{flexShrink:0,padding:'10px 14px calc(16px + env(safe-area-inset-bottom, 0px))',borderTop:`1px solid ${T.border}`,background:T.bg}},
    React.createElement('div',{style:{maxWidth:780,margin:'0 auto'}},
      React.createElement('div',{style:{background:T.surface2,border:`1px solid ${T.border}`,borderRadius:T.radiusLg,padding:'4px 6px 4px 14px',display:'flex',alignItems:'flex-end',gap:6,transition:'border-color 0.15s'}},
        React.createElement('textarea',{ref,value:text,onChange:e=>setText(e.target.value),onKeyDown:handleKey,placeholder:'Chat with Quark',disabled:running,rows:1,style:{flex:1,background:'transparent',border:'none',outline:'none',color:T.text,fontFamily:T.font,fontSize:14,lineHeight:1.5,resize:'none',padding:'9px 0',minHeight:20,maxHeight:200}}),
        running?
          React.createElement('button',{onClick:onCancel,style:{width:36,height:36,borderRadius:10,border:'none',background:T.redDim,color:T.red,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}},React.createElement(StopIcon))
        :
          React.createElement('button',{onClick:doSend,disabled:!hasText,style:{width:36,height:36,borderRadius:10,border:'none',background:hasText?T.accent:T.surface,color:hasText?'#fff':T.text3,cursor:hasText?'pointer':'default',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,transition:'all 0.15s'}},React.createElement(SendIcon))
      ),
      React.createElement('div',{className:'input-hint-text',style:{textAlign:'center',fontSize:11,color:T.text3,marginTop:4,opacity:0.4}},'Enter to send · Shift+Enter for newline')
    )
  );
}

// ═══════════════════════════════════════════════════════════════════
// PermissionDialog
// ═══════════════════════════════════════════════════════════════════
function PermissionDialog({perm,onRespond}){
  useEffect(()=>{
    const h=(e)=>{
      if(e.key==='a'||e.key==='A')onRespond('always');
      else if(e.key==='o'||e.key==='O')onRespond('once');
      else if(e.key==='r'||e.key==='R')onRespond('reject');
    };
    document.addEventListener('keydown',h);
    return()=>document.removeEventListener('keydown',h);
  },[onRespond]);

  return React.createElement('div',{style:{position:'fixed',inset:0,background:'rgba(0,0,0,0.6)',backdropFilter:'blur(4px)',zIndex:200,display:'flex',alignItems:'center',justifyContent:'center'}},
    React.createElement('div',{style:{background:T.surface,border:`1px solid ${T.border}`,borderRadius:T.radius,padding:20,maxWidth:440,width:'90%',boxShadow:'0 16px 48px rgba(0,0,0,0.5)'}},
      React.createElement('div',{style:{fontSize:15,fontWeight:600,color:T.text,marginBottom:4,display:'flex',alignItems:'center',gap:8}},
        React.createElement('svg',{width:18,height:18,viewBox:'0 0 18 18',fill:'none',stroke:T.yellow,strokeWidth:1.5,strokeLinecap:'round'},React.createElement('path',{d:'M9 1.5l7.5 13.5H1.5L9 1.5z'}),React.createElement('line',{x1:9,y1:7,x2:9,y2:10}),React.createElement('circle',{cx:9,cy:12.5,r:0.5,fill:T.yellow})),
        'Permission Required'
      ),
      React.createElement('div',{style:{fontSize:13,color:T.text2,marginBottom:12}},'Allow ',React.createElement('strong',{style:{color:T.text}},perm.tool),'?'),
      React.createElement('pre',{style:{background:T.bg,borderRadius:8,padding:10,fontFamily:T.mono,fontSize:12,color:T.text2,maxHeight:200,overflow:'auto',marginBottom:16,whiteSpace:'pre-wrap',wordBreak:'break-all'}},JSON.stringify(perm.input,null,2).slice(0,500)),
      React.createElement('div',{style:{display:'flex',gap:8}},
        React.createElement('button',{onClick:()=>onRespond('once'),style:{flex:1,padding:8,border:'none',borderRadius:8,fontSize:13,fontWeight:500,cursor:'pointer',background:T.greenDim,color:T.green}},'Allow Once'),
        React.createElement('button',{onClick:()=>onRespond('always'),style:{flex:1,padding:8,border:'none',borderRadius:8,fontSize:13,fontWeight:500,cursor:'pointer',background:T.surface2,color:T.text2}},'Always'),
        React.createElement('button',{onClick:()=>onRespond('reject'),style:{flex:1,padding:8,border:'none',borderRadius:8,fontSize:13,fontWeight:500,cursor:'pointer',background:T.redDim,color:T.red}},'Reject')
      )
    )
  );
}
