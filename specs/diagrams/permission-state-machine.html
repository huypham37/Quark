<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tool Call Status · Permission Gate</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.35rem;
    }
    .subtitle {
      font-family: var(--font-sans);
      font-size: 0.85rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State Machine · Quark Permission System</p>
    <h1>Tool call status lifecycle</h1>
    <p class="subtitle">New awaiting_approval gate between tool-call and execution</p>

    <svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============================================================ -->
      <!-- TRANSITIONS (drawn before boxes)                             -->
      <!-- ============================================================ -->

      <!-- Start → pending -->
      <line x1="52" y1="160" x2="100" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- pending → awaiting_approval -->
      <line x1="260" y1="160" x2="296" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="264" y="148" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="298" y="158" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">tool-call</text>

      <!-- awaiting_approval → running (accent — happy/granted path) -->
      <line x1="480" y1="160" x2="556" y2="160" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="492" y="148" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="518" y="158" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GRANTED</text>

      <!-- awaiting_approval → error (deny path) -->
      <line x1="390" y1="200" x2="380" y2="296" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="359" y="246" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="385" y="256" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DENY</text>

      <!-- running → completed -->
      <line x1="640" y1="200" x2="640" y2="296" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="596" y="244" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="640" y="254" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">tool-result</text>

      <!-- running → error (abort / exception) -->
      <path d="M 560 200 C 560 280, 450 280, 450 296" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="460" y="244" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="496" y="254" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">throw/abort</text>

      <!-- completed → End -->
      <line x1="720" y1="340" x2="752" y2="340" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- error → End -->
      <line x1="460" y1="340" x2="492" y2="340" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ============================================================ -->
      <!-- NODES                                                        -->
      <!-- ============================================================ -->

      <!-- Start dot -->
      <circle cx="44" cy="160" r="6" fill="#2d3142"/>

      <!-- State: pending -->
      <rect x="100" y="120" width="160" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="108" y="128" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="134" y="137" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="180" y="168" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">pending</text>
      <text x="180" y="186" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">streaming args</text>

      <!-- State: awaiting_approval (FOCAL — coral) -->
      <rect x="300" y="120" width="180" height="80" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="308" y="128" width="52" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="334" y="137" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="390" y="168" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">awaiting_approval</text>
      <text x="390" y="186" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">permission check</text>

      <!-- State: running -->
      <rect x="560" y="120" width="160" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="568" y="128" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="594" y="137" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="640" y="168" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">running</text>
      <text x="640" y="186" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tool executing</text>

      <!-- State: completed -->
      <rect x="560" y="300" width="160" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="568" y="308" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="594" y="317" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FINAL</text>
      <text x="640" y="348" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">completed</text>
      <text x="640" y="366" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tool-result OK</text>

      <!-- State: error -->
      <rect x="300" y="300" width="160" height="80" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="308" y="308" width="52" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="334" y="317" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FINAL</text>
      <text x="380" y="348" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">error</text>
      <text x="380" y="366" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">denied · failed · abort</text>

      <!-- End dot (completed path) -->
      <circle cx="762" cy="340" r="8" fill="none" stroke="#2d3142" stroke-width="1"/>
      <circle cx="762" cy="340" r="5" fill="#2d3142"/>

      <!-- End dot (error path) -->
      <circle cx="502" cy="340" r="8" fill="none" stroke="#2d3142" stroke-width="1"/>
      <circle cx="502" cy="340" r="5" fill="#2d3142"/>

      <!-- ============================================================ -->
      <!-- ANNOTATION — editor callout on awaiting_approval             -->
      <!-- ============================================================ -->
      <path d="M 390 100 L 390 80" stroke="#eb6c36" stroke-width="0.8" fill="none"/>
      <text x="390" y="72" fill="#eb6c36" font-size="12" font-family="'Instrument Serif', serif" font-style="italic" text-anchor="middle">new — permission gate before execute()</text>

      <!-- ============================================================ -->
      <!-- LEGEND (bottom strip)                                        -->
      <!-- ============================================================ -->
      <line x1="32" y1="448" x2="968" y2="448" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

      <text x="32" y="464" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em" text-anchor="start">LEGEND</text>

      <!-- Start dot legend -->
      <circle cx="32" cy="480" r="4" fill="#2d3142"/>
      <text x="44" y="484" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif" text-anchor="start"> Start</text>

      <!-- End dot legend -->
      <circle cx="100" cy="480" r="6" fill="none" stroke="#2d3142" stroke-width="0.8"/>
      <circle cx="100" cy="480" r="3.5" fill="#2d3142"/>
      <text x="112" y="484" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif" text-anchor="start"> Terminus</text>

      <!-- Regular state -->
      <rect x="196" y="474" width="20" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
      <text x="224" y="484" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif" text-anchor="start"> Intermediate state</text>

      <!-- Focal state -->
      <rect x="340" y="474" width="20" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/>
      <text x="368" y="484" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif" text-anchor="start"> New / focal state</text>

      <!-- Store (error) state -->
      <rect x="504" y="474" width="20" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="532" y="484" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif" text-anchor="start"> Terminal state</text>

      <!-- Dashed transition -->
      <line x1="660" y1="480" x2="700" y2="480" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="708" y="484" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif" text-anchor="start"> Deny / error path</text>

      <!-- Accent transition -->
      <line x1="840" y1="480" x2="880" y2="480" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="888" y="484" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif" text-anchor="start"> Granted path</text>

      <!-- ============================================================ -->
      <!-- FOOTER                                                       -->
      <!-- ============================================================ -->
      <text x="32" y="524" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">QUARK/SPECS/PERMISSION-FEATURE</text>
    </svg>
  </div>
</body>
</html>
