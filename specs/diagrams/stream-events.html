<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quark Stream Event Lifecycle</title>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #f5f5f5;
            --ink: #2d3142;
            --muted: #4f5d75;
            --soft: #7a8399;
            --accent: #eb6c36;
            --accent-tint: rgba(235,108,54,0.08);
            --link: #2e5aa8;
            --rule: rgba(45,49,66,0.12);
        }
        body {
            background-color: var(--paper);
            color: var(--ink);
            font-family: 'Geist', sans-serif;
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            width: 100%;
            max-width: 800px;
            margin-bottom: 2rem;
            text-align: left;
        }
        .eyebrow {
            font-family: 'Geist Mono', monospace;
            font-size: 8px;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--soft);
            margin-bottom: 0.5rem;
        }
        h1 {
            font-family: 'Instrument Serif', serif;
            font-size: 2rem;
            font-weight: 400;
            margin: 0;
            color: var(--ink);
        }
        .diagram-container {
            width: 100%;
            max-width: 800px;
            background: var(--paper);
        }
        svg {
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <header>
        <div class="eyebrow">Sequence Diagram</div>
        <h1>Quark Stream Event Lifecycle</h1>
    </header>

    <div class="diagram-container">
        <svg viewBox="0 0 800 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Background -->
            <rect width="800" height="1000" fill="#f5f5f5"/>

            <defs>
                <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                    <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
                </marker>
                <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                    <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
                </marker>
                <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                    <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
                </marker>
            </defs>

            <!-- Lifelines -->
            <line x1="120" y1="80" x2="120" y2="920" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,4"/>
            <line x1="320" y1="80" x2="320" y2="920" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,4"/>
            <line x1="520" y1="80" x2="520" y2="920" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,4"/>
            <line x1="720" y1="80" x2="720" y2="920" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,4"/>

            <!-- Activation Bars -->
            <rect x="316" y="140" width="8" height="760" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
            <rect x="516" y="140" width="8" height="720" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

            <!-- Actor Labels -->
            <rect x="60" y="32" width="120" height="48" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
            <text x="120" y="60" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">User (TUI)</text>

            <rect x="260" y="32" width="120" height="48" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
            <text x="320" y="60" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Processor</text>

            <rect x="460" y="32" width="120" height="48" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
            <text x="520" y="60" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">AI SDK</text>

            <rect x="660" y="32" width="120" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.3)" stroke-width="1"/>
            <text x="720" y="60" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Provider</text>

            <!-- Flow -->
            <!-- 0. Step Start -->
            <line x1="516" y1="150" x2="328" y2="150" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
            <text x="422" y="144" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">START-STEP</text>

            <!-- 1. Reasoning Lifecycle -->
            <line x1="516" y1="200" x2="328" y2="200" stroke="#eb6c36" stroke-width="1" marker-end="url(#arrow-accent)"/>
            <text x="422" y="194" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">REASONING-START (THINKING)</text>

            <line x1="516" y1="230" x2="328" y2="230" stroke="#eb6c36" stroke-width="1" marker-end="url(#arrow-accent)"/>
            <text x="422" y="224" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">REASONING-DELTA</text>

            <!-- 2. Text Lifecycle -->
            <line x1="516" y1="300" x2="328" y2="300" stroke="#eb6c36" stroke-width="1" marker-end="url(#arrow-accent)"/>
            <text x="422" y="294" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">TEXT-START</text>

            <line x1="516" y1="330" x2="328" y2="330" stroke="#eb6c36" stroke-width="1" marker-end="url(#arrow-accent)"/>
            <text x="422" y="324" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">TEXT-DELTA</text>

            <!-- 3. Tool Lifecycle -->
            <line x1="516" y1="400" x2="328" y2="400" stroke="#eb6c36" stroke-width="1" marker-end="url(#arrow-accent)"/>
            <text x="422" y="394" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">TOOL-INPUT-START</text>

            <line x1="516" y1="440" x2="328" y2="440" stroke="#eb6c36" stroke-width="1" marker-end="url(#arrow-accent)"/>
            <text x="422" y="434" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">TOOL-CALL (FULL ARGS)</text>

            <!-- 4. Local execution -->
            <path d="M 324 460 Q 360 480 324 500" stroke="#4f5d75" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
            <text x="370" y="484" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">RUN BASH/READ_FILE</text>

            <!-- 5. Tool result event -->
            <line x1="516" y1="540" x2="328" y2="540" stroke="#eb6c36" stroke-width="1" marker-end="url(#arrow-accent)"/>
            <text x="422" y="534" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">TOOL-RESULT (EVENT)</text>

            <!-- 6. Finish Step -->
            <line x1="516" y1="620" x2="328" y2="620" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
            <text x="422" y="614" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">FINISH-STEP (REASON: TOOL-CALLS)</text>

            <!-- 7. Loop Sync -->
            <line x1="316" y1="700" x2="128" y2="700" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
            <text x="220" y="694" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">BUS: STEP-FINISH (TOKENS)</text>

            <line x1="312" y1="760" x2="128" y2="760" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
            <text x="220" y="754" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">RETURN "CONTINUE"</text>

            <!-- Legend -->
            <line x1="40" y1="940" x2="760" y2="940" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
            <text x="40" y="965" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

            <rect x="120" y="958" width="8" height="8" rx="1" fill="#eb6c36"/>
            <text x="136" y="966" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">AI SDK EVENT</text>

            <rect x="260" y="958" width="8" height="8" rx="1" fill="#4f5d75"/>
            <text x="276" y="966" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">INTERNAL / BUS</text>
        </svg>
    </div>

    <footer style="margin-top: 4rem; width: 100%; max-width: 800px; border-top: 1px solid var(--rule); padding-top: 1rem;">
        <div style="font-family: 'Geist Mono', monospace; font-size: 8px; color: var(--soft);">
            QUARK ARCHITECTURE // SESSION STREAMING V1.0
        </div>
    </footer>
</body>
</html>
