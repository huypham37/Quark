name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # NOTE: `bun test` is intentionally not run yet — the suite is currently
      # order-dependent (shared HOME/env/config-cache state) and one test hits
      # the live Codex API. Add a test step once the suite is isolated & hermetic.
