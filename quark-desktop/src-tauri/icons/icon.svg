<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Quark app icon</title>
  <desc>Three cream quark dots connected by curved salmon gluon arcs on a warm espresso background</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#241810"/>
      <stop offset="100%" stop-color="#0D0806"/>
    </radialGradient>
    <radialGradient id="qk" cx="36%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#F7EDD8"/>
      <stop offset="60%" stop-color="#DEC89A"/>
      <stop offset="100%" stop-color="#B89260"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EDE0C4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#EDE0C4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4856a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#d4856a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <circle cx="512" cy="512" r="260" fill="url(#center-glow)"/>

  <circle cx="512" cy="322" r="155" fill="url(#halo)"/>
  <circle cx="344" cy="620" r="155" fill="url(#halo)"/>
  <circle cx="680" cy="620" r="155" fill="url(#halo)"/>

  <g fill="none" stroke="#d4856a" stroke-width="24" stroke-linecap="round" opacity="0.88">
    <path d="M 512 322 Q 278 418 344 620"/>
    <path d="M 344 620 Q 512 738 680 620"/>
    <path d="M 680 620 Q 746 418 512 322"/>
  </g>

  <circle cx="512" cy="322" r="72" fill="url(#qk)"/>
  <circle cx="344" cy="620" r="72" fill="url(#qk)"/>
  <circle cx="680" cy="620" r="72" fill="url(#qk)"/>
</svg>
