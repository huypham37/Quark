[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "quark-web-proxy"
version = "0.1.0"
description = "Unified OpenAI-compatible proxy for web LLM providers (Claude, Qwen, Perplexity, Meta)"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "curl_cffi",
    "pycryptodome",
]

[project.scripts]
quark-web-proxy = "web_proxy.run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["web_proxy*"]
